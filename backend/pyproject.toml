[project]
name = "yammic-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.30", "sqlalchemy>=2.0", "psycopg[binary]>=3.2",
  "pyjwt>=2.8", "pydantic>=2.7", "sse-starlette>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pgserver>=0.1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
