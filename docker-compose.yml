# Local demo infrastructure for the Yamicc v5 stack.
# Owner: DevOps (CEL-1801). Only local, synthetic data. No hosting, no real patient data.
#
# This stack is parallel-safe with the frozen v3 stack: it has its own compose
# project (`yamicc-v5`), its own volume and its own host ports. No fixed
# container_name, so the two stacks cannot take each other's containers away.
#
#   postgres   PostgreSQL 16      host 127.0.0.1:5435   db yamicc (role yamicc_app)
#                                                      + hapi (role hapi) + hapi2 (role hapi2)
#   hapi       HAPI FHIR R4       host 127.0.0.1:8093   hospital 1, db hapi
#   hapi2      HAPI FHIR R4       host 127.0.0.1:8094   hospital 2, db hapi2
#
# Every host port comes from the environment and defaults to the v5 values.
# The v3 stack (Postgres 5433, HAPI 8090) is untouched while this one runs.
# The FastAPI backend and the Flutter web app run outside Docker (see Makefile).
# Images are pinned by digest so a demo run never depends on a registry pull.

name: yamicc-v5

services:
  postgres:
    # postgres:16, pulled 2026-11-21
    image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
    environment:
      POSTGRES_DB: yamicc
      POSTGRES_USER: yamicc
      POSTGRES_PASSWORD: yamicc
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?run via make (ops/ensure-env.sh creates ops/.env.local)}
      HAPI_DB_PASSWORD: ${HAPI_DB_PASSWORD:?run via make (ops/ensure-env.sh creates ops/.env.local)}
      HAPI2_DB_PASSWORD: ${HAPI2_DB_PASSWORD:?run via make (ops/ensure-env.sh creates ops/.env.local)}
      # Keep initdb output small and fast on a laptop.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "127.0.0.1:${PG_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/postgres-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yamicc -d yamicc"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  hapi:
    # hapiproject/hapi:latest, pulled 2026-11-21 (same pinned digest as v3)
    image: hapiproject/hapi:latest@sha256:0ff86aac4c7bd13a1ee226444a70263bb46ed1c28ef543c30a44f865b80ca04e
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # JPA server backed by the same PostgreSQL instance, database "hapi".
      spring.datasource.url: "jdbc:postgresql://postgres:5432/hapi"
      spring.datasource.username: hapi
      spring.datasource.password: ${HAPI_DB_PASSWORD:?run via make}
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hapi.fhir.fhir_version: R4
      # Pin CORS to the v5 web origin, so a cross-site page gets 403 and cannot
      # read patient data from the browser.
      hapi.fhir.cors.allowed_origin: "http://127.0.0.1:${WEB_PORT:-8082}"
      hapi.fhir.cors.allow_Credentials: "false"
      hapi.fhir.server_address: "http://127.0.0.1:${FHIR_PORT:-8093}"
      management.endpoints.web.exposure.include: health,info
      management.endpoint.health.show-details: never
      JAVA_TOOL_OPTIONS: "-Xmx1536m"
    ports:
      - "127.0.0.1:${FHIR_PORT:-8093}:8080"
    healthcheck:
      # The image ships HealthCheck.class; it probes the Spring Boot actuator
      # health endpoint on 127.0.0.1:8080 and exits 0 only on HTTP 200.
      test: ["CMD", "java", "-cp", "/app", "HealthCheck"]
      interval: 10s
      timeout: 8s
      retries: 30
      # First boot also creates the HAPI schema in PostgreSQL: 60-180 s.
      start_period: 240s
    restart: unless-stopped

  hapi2:
    # Second hospital: same pinned image, own database `hapi2` and DB user `hapi2`.
    image: hapiproject/hapi:latest@sha256:0ff86aac4c7bd13a1ee226444a70263bb46ed1c28ef543c30a44f865b80ca04e
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      spring.datasource.url: "jdbc:postgresql://postgres:5432/hapi2"
      spring.datasource.username: hapi2
      spring.datasource.password: ${HAPI2_DB_PASSWORD:?run via make}
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hapi.fhir.fhir_version: R4
      hapi.fhir.cors.allowed_origin: "http://127.0.0.1:${WEB_PORT:-8082}"
      hapi.fhir.cors.allow_Credentials: "false"
      hapi.fhir.server_address: "http://127.0.0.1:${FHIR2_PORT:-8094}"
      management.endpoints.web.exposure.include: health,info
      management.endpoint.health.show-details: never
      JAVA_TOOL_OPTIONS: "-Xmx1536m"
    ports:
      - "127.0.0.1:${FHIR2_PORT:-8094}:8080"
    healthcheck:
      test: ["CMD", "java", "-cp", "/app", "HealthCheck"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 240s
    restart: unless-stopped

volumes:
  pgdata:
    # Own volume, separate from v3's yamicc-postgres-data.
    name: yamicc-v5-postgres-data
